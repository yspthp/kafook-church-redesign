<!doctype html><html lang="zh-Hant-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CMS 後台 | 五旬節聖潔會迦福堂</title><link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"><link rel="stylesheet" href="css/redesign.css"><link rel="stylesheet" href="css/mobile-fix.css"><link rel="stylesheet" href="css/cms.css"></head><body class="redesign-body"><header class="site-header nav-editorial" id="siteHeader"><div class="nav-container"><a class="logo-link" href="index.html"><img src="images/brand.svg" width="36" height="36" alt="迦福堂標誌"><span class="logo-text-group"><span class="logo-church-name">五旬節聖潔會迦福堂</span><span class="logo-subtext">Ka Fook Church CMS</span></span></a><ul class="nav-menu" id="navMenu"><li class="nav-item"><a class="nav-link" href="index.html">返回網站</a></li><li class="nav-item"><a class="nav-link" href="members.html">會友專區</a></li></ul><div class="nav-actions"><button class="mobile-menu-toggle" id="menuToggle" type="button" aria-label="開啟導覽選單" aria-expanded="false" aria-controls="navMenu">☰</button></div></div></header><main id="mainContent" class="section"><div class="container"><div id="adminGate" class="card"><h1>CMS 後台</h1><p>此頁只供 staff / admin 使用。請先從會友專區登入。</p><a class="btn btn-primary" href="members.html">前往登入</a></div><div id="adminApp" class="is-hidden"><div class="section-header"><span class="section-subtitle">CONTENT MANAGEMENT</span><h1 class="section-title">幹事 CMS 後台</h1><p data-admin-status class="cms-status" role="status">準備中…</p></div><div class="cms-grid"><section class="card"><h2>發佈通告</h2><form id="noticeForm" class="cms-form"><label>標題<input name="title" required></label><label>分類<input name="category" value="堂會通告" required></label><label>內容<textarea name="content" required></textarea></label><label>公開程度<select name="visibility"><option value="public">公開</option><option value="members">僅限會友</option></select></label><label>附件 PDF<input name="attachment" type="file" accept="application/pdf"></label><button type="submit">發佈通告</button></form></section><section class="card"><h2>新增特別聚會</h2><form id="eventForm" class="cms-form"><label>活動名稱<input name="title" required></label><label>分類<input name="category" value="特別聚會" required></label><label>日期時間<input name="starts_at" type="datetime-local" required></label><label>地點<input name="location"></label><label>詳情<textarea name="description"></textarea></label><label><input name="featured" type="checkbox" value="true">焦點活動</label><button type="submit">發佈活動</button></form></section><section class="card"><h2>新增代禱事項</h2><form id="prayerFormCms" class="cms-form"><label>主題<input name="title" required></label><label>分類<input name="category" value="堂會代禱" required></label><label>內容<textarea name="content" required></textarea></label><button type="submit">發佈代禱</button></form></section></div></div></div></main><script src="js/main.js"></script><script src="js/supabase-config.js"></script><script src="js/cms.js"></script></body></html>
